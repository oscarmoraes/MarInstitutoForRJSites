<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#17344D" />
      <stop offset="50%" stop-color="#12273A" />
      <stop offset="100%" stop-color="#0B1926" />
    </linearGradient>
    <linearGradient id="red-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E53935" />
      <stop offset="100%" stop-color="#C6282D" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA820A" />
    </linearGradient>
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.04" />
    </pattern>
    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundo com gradiente institucional -->
  <rect width="1200" height="675" fill="url(#bg-grad)" />

  <!-- Malha de linhas sutis de fundo -->
  <rect width="1200" height="675" fill="url(#grid-pattern)" />

  <!-- Elementos decorativos circulares de fundo -->
  <circle cx="600" cy="300" r="320" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.05" />
  <circle cx="600" cy="300" r="240" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.07" stroke-dasharray="4 6" />
  <circle cx="600" cy="300" r="160" fill="none" stroke="#C6282D" stroke-width="1.5" stroke-opacity="0.15" />

  <!-- Faixa decorativa superior -->
  <rect x="0" y="0" width="1200" height="5" fill="url(#red-accent)" />

  <!-- Símbolo Central: Balança da Justiça Oficial MAR -->
  <g transform="translate(600, 240)">
    <!-- Aura central -->
    <circle cx="0" cy="0" r="95" fill="#17344D" fill-opacity="0.8" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2" />
    <circle cx="0" cy="0" r="88" fill="none" stroke="url(#red-accent)" stroke-width="2.5" />

    <!-- Ícone da Balança da Justiça -->
    <g transform="translate(0, -10)" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Haste central vertical -->
      <line x1="0" y1="-45" x2="0" y2="42" stroke-width="4" stroke="#FFFFFF" />
      <!-- Base sólida -->
      <path d="M -24 42 L 24 42" stroke-width="5" stroke="url(#red-accent)" />
      <path d="M -15 36 L 15 36" stroke-width="3" stroke="#FFFFFF" />
      <!-- Topo ornado -->
      <circle cx="0" cy="-48" r="4" fill="#C6282D" stroke="none" />
      <!-- Trave horizontal -->
      <line x1="-50" y1="-30" x2="50" y2="-30" stroke-width="3.5" stroke="#FFFFFF" />
      
      <!-- Prato Esquerdo -->
      <line x1="-50" y1="-30" x2="-68" y2="-2" stroke-width="1.5" stroke-opacity="0.8" />
      <line x1="-50" y1="-30" x2="-32" y2="-2" stroke-width="1.5" stroke-opacity="0.8" />
      <path d="M -72 -2 Q -50 14 -28 -2 Z" fill="#FFFFFF" fill-opacity="0.25" stroke="#FFFFFF" stroke-width="2" />

      <!-- Prato Direito -->
      <line x1="50" y1="-30" x2="32" y2="-2" stroke-width="1.5" stroke-opacity="0.8" />
      <line x1="50" y1="-30" x2="68" y2="-2" stroke-width="1.5" stroke-opacity="0.8" />
      <path d="M 28 -2 Q 50 14 72 -2 Z" fill="#FFFFFF" fill-opacity="0.25" stroke="#FFFFFF" stroke-width="2" />
    </g>
  </g>

  <!-- Tipografia Oficial Instituto MAR -->
  <g text-anchor="middle">
    <!-- Tagline superior -->
    <rect x="500" y="385" width="200" height="24" rx="12" fill="#C6282D" fill-opacity="0.25" stroke="#C6282D" stroke-opacity="0.6" stroke-width="1" />
    <text x="600" y="401" font-family="'Inter', 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#FF8A80" letter-spacing="2.5">
      INSTITUCIONAL
    </text>

    <!-- Título Principal -->
    <text x="600" y="450" font-family="'Manrope', 'Cinzel', 'Trajan Pro', Georgia, serif" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="3">
      INSTITUTO MAR
    </text>

    <!-- Linha divisória de apoio -->
    <line x1="520" y1="472" x2="680" y2="472" stroke="url(#red-accent)" stroke-width="2" stroke-linecap="round" />

    <!-- Subtítulo / Lema -->
    <text x="600" y="505" font-family="'Inter', 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#B0BEC5" letter-spacing="3.5">
      MOVIMENTO DA ADVOCACIA RENOVADA
    </text>
    
    <text x="600" y="535" font-family="'Inter', 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#607D8B" letter-spacing="1">
      Ética • Independência • Prerrogativas • Inovação
    </text>
  </g>

  <!-- Marca d'água no rodapé -->
  <text x="1160" y="645" text-anchor="end" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#ffffff" fill-opacity="0.2" letter-spacing="1">
    PORTAL OFICIAL DO INSTITUTO MAR
  </text>
</svg>
